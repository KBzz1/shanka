        - base_card_version
        - front
        - back
        - card_type
        - target_difficulty
        - status
        - expires_at
        - created_at
      properties:
        rewrite_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        base_card_version:
          type: string
          description: 应用时乐观并发校验(CAS)
        front:
          type: string
        back:
          type: string
        card_type:
          $ref: '#/components/schemas/CardType'
        target_difficulty:

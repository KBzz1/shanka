        created_at:
          type: string
          format: date-time

    TodayPlanCard:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          properties:
            review_state:
              $ref: '#/components/schemas/ReviewState'
            forgetting_risk:
              type: number
              description: 统一 FSRS 适配器按服务端 now 计算;无法计算时置 0
            plan_kind:
              type: [string, 'null']
              enum: [DUE, NEW, null]

    TodayStudyPlan:
      type: object
      required:
        - timezone
        - study_date
        - current_project
        - daily_goal
        - today_completed_count
        - due_count
        - main_plan_remaining
        - backlog_count
        - cards
      properties:
        timezone:
          type: string
          description: 账号学习时区
        study_date:
          type: string
          format: date
          description: 账号学习时区下的学习日期
        current_project:
          anyOf:
            - $ref: '#/components/schemas/LearningProject'
            - type: 'null'
          description: 无当前项目时返回 null(空态)
        daily_goal:
          type: integer
          description: 当天实际核心队列目标（新学 + 巩固）；可用卡不足时按实际队列收敛
        today_completed_count:
          type: integer
          description: 今日去重完成数(同一 (账号学习日期, card_id) 只计一次)
        due_count:
          type: integer
        main_plan_remaining:
          type: integer
        backlog_count:
          type: integer
          description: 到期总数超出每日目标的部分
        cards:
          type: array
          items:
            $ref: '#/components/schemas/TodayPlanCard'
          description: 有序卡片列表(到期卡按遗忘风险、逾期时长、card_id;新卡按 deck_id、position、card_id)
        daily_new_goal:
          type: integer
        daily_review_goal:
          type: integer
        new_completed_count:
          type: integer
        review_completed_count:
          type: integer
        new_remaining_count:
          type: integer
        review_remaining_count:
          type: integer
        core_target_count:
          type: integer
        plan_configured:
          type: boolean
        selected_deck_ids:
          type: array
          items:
            type: string
            format: uuid

  responses:
    BadRequest:
      description: 请求非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        受保护接口:缺失、非法、撤销或过期的 Bearer 会话(AUTH_REQUIRED / AUTH_INVALID,携带 WWW-Authenticate: Bearer);
        登录接口:凭据错误(INVALID_CREDENTIALS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 状态冲突或幂等内容不一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 业务校验失败(如 PDF_TOC_MISSING、API_KEY_INVALID)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

        weekly_total:
          type: integer
        weekly_completed_count:
          type: integer
        weekly_new_goal:
          type: integer
        weekly_review_goal:
          type: integer
        weekly_goal:
          type: integer
        weekly_goal_progress:
          type: [number, 'null']
        new_completed_count:
          type: integer
        review_completed_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    DeletionTaskBlocker:
      type: object
      required: [task_id, status, can_abandon, can_cancel, allowed_actions]
      properties:
        task_id:
          type: string
          format: uuid

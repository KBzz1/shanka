        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RewritePreviewStatus:
      type: string
      enum: [PENDING, APPLIED, CANCELLED, EXPIRED]

    CardRewritePreview:
      type: object
      required:
        - rewrite_id

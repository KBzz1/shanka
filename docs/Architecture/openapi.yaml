            type: string
            format: uuid
          description: 只限制新卡;空数组表示暂无新卡范围
        include_unassigned:
          type: boolean
          description: 是否包含 chapter_id=null 的新卡
        selected_deck_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 今日学习计划选中的卡组；空数组表示尚未配置
        daily_new_goal:
          type: integer
          minimum: 0
          maximum: 200
          multipleOf: 10
        daily_review_goal:
          type: integer
          minimum: 0
          maximum: 200
          multipleOf: 10
        updated_at:
          type: string
          format: date-time

    ProjectStudySettingsUpdateRequest:
      type: object
      properties:
        selected_new_card_chapter_ids:
          type: array
          items:
            type: string
            format: uuid
        include_unassigned:
          type: boolean
        selected_deck_ids:
          type: array
          items:
            type: string
            format: uuid
        daily_new_goal:
          type: integer

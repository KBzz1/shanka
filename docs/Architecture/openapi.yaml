        created_at:
          type: string
          format: date-time
      description: 不可变记录(契约 3.11);本期无查询接口,评级提交时服务端内部使用

    ReviewEventRequest:
      type: object
      required: [card_id, rating, client_event_id]
      properties:
        card_id:
          type: string
          format: uuid
        rating:
          $ref: '#/components/schemas/Rating'
        client_event_id:
          type: string
          format: uuid
          description: 客户端生成,设备内唯一,离线重试幂等

    ReviewQueueItem:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          required: [review_state]
          properties:
            review_state:
              $ref: '#/components/schemas/ReviewState'

    StatsDashboard:
      type: object
      required:
        - period
        - timezone
        - weekly_activity
        - weekly_total
        - weekly_completed_count
        - week_change_rate
        - weekly_goal
        - weekly_goal_progress
        - recall_accuracy
        - first_answer_accuracy
        - retention_rate
        - streak_days
        - mastered_card_count
        - updated_at
        - has_data
      properties:
        period:
          type: object
          required: [start, end, week_ordinal]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            week_ordinal:
              type: integer
        timezone:
          type: string
          description: 实际分桶时区 = 账号学习时区
        weekly_activity:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: integer
          description: 周一~周日每日复习事件数(按学习时区分桶)
        weekly_total:
          type: integer
        weekly_completed_count:
          type: integer
          description: 本周不同 (账号学习日期, card_id) 数(去重)
        week_change_rate:
          type: [number, 'null']
          description: 上周为 0 时返回 null(客户端显示"暂无对比")
        weekly_goal:
          type: integer
          description: 账号看板兼容字段；项目周统计按每日新学与每日巩固目标之和 × 7 派生
        weekly_goal_progress:
          type: number
          description: min(weekly_completed_count / weekly_goal, 1)
        updated_at:
          type: string
          format: date-time
          description: 聚合快照生成时间(PRD 6.6,客户端据此判断缓存过期)
        recall_accuracy:
          type: [number, 'null']
          description: 周期内 GOOD 事件 / 全部事件,分母为 0 时 null
        first_answer_accuracy:
          type: [number, 'null']
          description: 首次评级为 GOOD 的卡数 / 首次复习卡数,分母为 0 时 null
        retention_rate:
          type: [number, 'null']
          description: 非首次事件中 GOOD 数 / 非首次事件数,分母为 0 时 null
        streak_days:
          type: integer
          description: 截至用户本地当天连续有复习事件的自然日数;按本次请求 timezone 分桶,不按各事件 device_timezone
        mastered_card_count:
          type: integer
          description: 掌握卡片数(state=REVIEW 且 stability>=21 天)
        has_data:
          type: boolean
          description: false 时客户端展示空态
    QualitySummary:
      type: object
      properties:
        group_by:
          type: string
          description: model=batch.model;pdf=任务 file_id;difficulty=Batch.generation_unit_id 对应单元的 target_difficulty(单元缺失/锚定缺失为 unknown)
        groups:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              rubric_version:
                type: [string, 'null']
                description: 分组按批次 rubric_version 拆子组;跨版本窗口不混算(null 为无评分版本批次)
              card_count:
                type: integer
                description: 经批次归属的卡数(= eligible_card_count)
              eligible_card_count:
                type: integer
                description: 评分样本候选卡数(经批次归属)
              scored_card_count:
                type: integer
                description: rubric_total_score 非 NULL 的卡数(已被评分口径)
              sampling_rate:
                type: [number, 'null']
                description: scored_card_count / eligible_card_count;分母 0 时为 null
              evidence_avg:
                type: number
                format: float
                description: 仅以 evidence_score 非 NULL 的卡为分母(NULL 不计 0 分)
              correctness_avg:
                type: number
                format: float
              difficulty_avg:
                type: number
                format: float
              learning_value_avg:
                type: number
                format: float
              coverage_avg:
                type: number
                format: float
                description: 含 SKIPPED 批次(coverage=0 计入分母)
              duplicate_avg:
                type: number
                format: float
              task_completion_rate:
                type: number
                format: float
              cost_estimate:
                type: object
                properties:
                  cache_hit:
                    type: number
                    description: 估算金额(元)
                  cache_miss:
                    type: number
                  output:
                    type: number
                  total:
                    type: number
                  scope:
                    type: string
                    description: 恒为 generation-stage-only(Batch token 为生成阶段兼容投影,非全链路成本)
        days:
          type: integer
        generated_at:
          type: string
    # ---- 账号(V2.2,决策 D-05;结构契约 3.14/3.15) ----
    AuthRegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 24
          description: 展示名（中文/字母/数字/._-，可重名）
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: 登录键；服务端转小写规范化
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 8~128 字符,不截断、不 normalization
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    AuthUser:
      type: object
      required: [user_id, username, email, avatar_key, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
          description: 1~24 位展示名，中文/字母/数字/._-，可重名
        email:
          type: string
          description: 只读返回规范化后的当前登录邮箱,不可 PATCH
        avatar_key:
          type: string
          enum: [mood_01, mood_02, mood_03, mood_04, mood_05, mood_06, mood_07, mood_08, mood_09, mood_10, mood_11, mood_12]
          description: 系统预设头像,只接受内置预设;默认 mood_01
        created_at:
          type: string
          description: ISO 8601 UTC(结构契约 1.2)
    AuthMeUpdateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 24
          description: 展示名(中文/字母/数字/._-)
        avatar_key:
          type: string
          enum: [mood_01, mood_02, mood_03, mood_04, mood_05, mood_06, mood_07, mood_08, mood_09, mood_10, mood_11, mood_12]
      description: 至少提供一个字段;email 只读不可改
    AuthSessionResponse:
      type: object
      required: [user, access_token, token_type, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        access_token:
          type: string
          description: 256-bit 随机 opaque token;仅本响应与客户端安全存储出现
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          description: 会话绝对过期时间(签发 + 30 天,ISO 8601 UTC)

    # ---- V2.5 新增资源 ----
    UserPreferences:
      type: object
      required:
        - default_coverage_mode
        - default_difficulty_ratio
        - daily_learning_goal
        - learning_timezone
        - current_project_id
        - updated_at
      properties:

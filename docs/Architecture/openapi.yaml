          $ref: '#/components/schemas/CoverageMode'
        default_difficulty_ratio:
          $ref: '#/components/schemas/DifficultyRatio'
        daily_learning_goal:
          type: integer
          minimum: 10
          maximum: 200
          multipleOf: 10
          description: 旧账号兼容偏好；新项目的每日新学/巩固目标由 StudyPlan 保存
        learning_timezone:
          type: string
          description: 有效 IANA 时区,账号级权威
        current_project_id:
          type: [string, 'null']
          format: uuid
          description: 当前学习项目;项目删除时服务端置空
        updated_at:
          type: string
          format: date-time

    UserPreferencesUpdateRequest:
      type: object
      properties:
        default_coverage_mode:
          $ref: '#/components/schemas/CoverageMode'
        default_difficulty_ratio:
          $ref: '#/components/schemas/DifficultyRatio'
        daily_learning_goal:
          type: integer
          minimum: 10
          maximum: 200
          multipleOf: 10
          description: 旧账号兼容偏好；新项目的每日新学/巩固目标由 StudyPlan 保存
        learning_timezone:
          type: string
          description: 有效 IANA 时区
        current_project_id:
          type: [string, 'null']
          format: uuid
      description: 部分更新(last-success-wins);比例/目标/IANA 时区服务端校验(400 INVALID_PREFERENCES / INVALID_LEARNING_TIMEZONE)

    ProjectStatus:
      type: string
      enum: [EMPTY, PARSING, PARSE_FAILED, AWAITING_CHAPTER_CONFIRMATION, READY]
      description: 由资料状态与章节确认状态聚合派生(structure-contract 3.16):无资料=EMPTY;任一 PDF PARSING/PENDING=PARSING;有可用章节来源且未确认=AWAITING_CHAPTER_CONFIRMATION;确认后=READY;全部 PDF FAILED 且无可用章节=PARSE_FAILED

    LearningProject:
      type: object
      required:
        - project_id
        - name
        - materials
        - status
        - chapter_count
        - deck_count
        - task_count
        - created_at
        - updated_at
        - version
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: 去首尾空白后 1~60 字符,可重名
        materials:
          type: array
          description: 资料集合摘要(structure-contract 3.2a);空数组=空项目;列表响应可只返回摘要
          items:
            $ref: '#/components/schemas/Material'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        chapter_count:
          type: integer
        deck_count:
          type: integer
        task_count:
          type: integer
        tasks:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Task'
          description: 项目详情返回的任务快照;列表响应可省略
        chapters:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Chapter'
          description: 项目详情返回的跨资料章节列表;列表响应可省略
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: string
          description: 缓存刷新与并发检查;状态终态跃迁(解析/任务,契约 4.5)必刷新

    ProjectStudySettings:
      type: object

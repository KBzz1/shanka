        updated_at:
          type: string
          format: date-time

    ReviewEvent:
      type: object
      required: [review_event_id, client_event_id, card_id, rating, reviewed_at, created_at]
      properties:
        review_event_id:
          type: string
          format: uuid
        client_event_id:
          type: string
          format: uuid
          description: 客户端生成,设备内唯一,离线重试幂等
        card_id:
          type: string
          format: uuid
        rating:
          $ref: '#/components/schemas/Rating'
        reviewed_at:
          type: string
          format: date-time
          description: 服务端时间
        device_timezone:
          type: [string, 'null']

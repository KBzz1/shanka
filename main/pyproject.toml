# 依赖与 lint 配置唯一事实源（CLAUDE.md 工具链）
# 锁定方式（R-02 解决）：cd main && conda run -n shanka-backend pip-compile \
#   pyproject.toml --extra dev --output-file requirements-dev.lock
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shanka-backend"
version = "0.1.0"
description = "闪卡 App v2.1 后端（契约驱动实现）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "prometheus-client>=0.20",
  "fsrs>=4.0,<5",  # py-fsrs 项目（open-spaced-repetition/py-fsrs），PyPI 发行名 fsrs；固定 4.x 线（V2 fix round 1 裁决：契约 4.3/5.2 兼容性验证基线，详见 task-1-report；v5+ 移除 State.New 且学习步进语义漂移；残余差异由主 Agent 登记 R-13）
  "pypdf>=4.0",  # V3A PDF 生命周期：文本层 + 书签目录解析（services/pdf/parser.py）
  "python-multipart>=0.0.9",  # V3A Task 4：POST /pdfs multipart 上传解析（fastapi File 依赖）
  "cryptography>=42.0",  # V3B Task 1：AES-256-GCM API Key 加密（infra/llm/crypto.py，database-design 2.2）
  "argon2-cffi>=23.1.0",  # P4-1：Argon2id 密码哈希（services/auth/password.py，DESIGN §4.2）
  "jsonschema>=4.20",  # V5A Task 1：card.schema.json 校验器（services/generation/schema_validator.py，5.8 Schema 唯一入库门槛）
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "domain", "services", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# fsrs 4.x 无类型桩（无 py.typed）
[[tool.mypy.overrides]]
module = ["fsrs"]
ignore_missing_imports = true

# jsonschema 无类型桩（无 py.typed）
[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

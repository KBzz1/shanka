# 依赖与 lint 配置唯一事实源（CLAUDE.md 工具链）
# 锁定方式（R-02 解决）：cd main && conda run -n shanka-backend pip-compile \
#   pyproject.toml --extra dev --output-file requirements-dev.lock
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shanka-backend"
version = "0.1.0"
description = "闪卡 App v2.1 后端（契约驱动实现）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "domain", "services", "infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
